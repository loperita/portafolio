# Todos los días a las 00:00 hora Colombia: consulta la TRM oficial y actualiza
# los precios en USD de la versión en inglés (sitio + PDF).
# También se puede correr a mano: pestaña Actions > "Actualizar precios (TRM)" > Run workflow.
name: Actualizar precios (TRM)

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 00:00 en Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Consultar TRM y actualizar precios
        id: trm
        run: python3 .github/scripts/actualizar_precios.py

      - name: Regenerar el PDF en inglés (solo si cambió algún precio)
        if: steps.trm.outputs.prices_changed == 'true'
        run: |
          # Arial y Georgia, para que el PDF se vea igual al generado en Windows
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          (sudo apt-get update -qq && sudo apt-get install -y -qq ttf-mscorefonts-installer >/dev/null) || echo "No se pudieron instalar las fuentes; se usan las equivalentes"
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --run-all-compositor-stages-before-draw --virtual-time-budget=5000 \
            --print-to-pdf="$PWD/Pablo-Moreno-Portfolio-EN.pdf" "file://$PWD/pdf/one-pager-en.html"
          ls -la Pablo-Moreno-Portfolio-EN.pdf

      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/index.html pdf/one-pager-en.html Pablo-Moreno-Portfolio-EN.pdf
          if git diff --cached --quiet; then
            echo "Sin cambios: la TRM no ha variado."
            exit 0
          fi
          git commit -m "Precios en USD con la TRM del ${{ steps.trm.outputs.fecha }}"
          git push
          # Pide a GitHub Pages que publique el cambio
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
